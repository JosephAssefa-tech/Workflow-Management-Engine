version: '3.9'

services:
  frontend:
    build:
      context: ./workflow-management-portal
    ports:
      - "4200:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./WorkflowManagementEngine
    ports:
      - "5000:5000"
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: workflow-sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Admin@123456
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

volumes:
  sql_data: