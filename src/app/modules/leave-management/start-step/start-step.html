<h3>{{ step.displayName }}</h3>

<form [formGroup]="form" (ngSubmit)="submit()" class="max-4x">

  <!-- Employee Name -->
  <mat-form-field appearance="fill" style="display:block; margin-bottom:12px;">
    <mat-label>Employee Name</mat-label>
    <input matInput formControlName="employeeName" />
    <mat-error *ngIf="form.get('employeeName')?.hasError('required')">
      Employee name is required
    </mat-error>
  </mat-form-field>

  <!-- Leave Days -->
  <mat-form-field appearance="fill" style="display:block; margin-bottom:12px;">
    <mat-label>Number of Days</mat-label>
    <input matInput type="number" formControlName="days" />
    <mat-error *ngIf="form.get('days')?.hasError('required')">
      Days are required
    </mat-error>
    <mat-error *ngIf="form.get('days')?.hasError('min')">
      Must be at least 1 day
    </mat-error>
  </mat-form-field>

  <!-- Leave Dates -->
  <mat-form-field appearance="fill" style="display:block; margin-bottom:12px;">
    <mat-label>Leave Date</mat-label>
    <input matInput [matDatepicker]="picker" formControlName="leaveDate" />
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <!-- Reason -->
  <mat-form-field appearance="fill" style="display:block; margin-bottom:12px;">
    <mat-label>Reason</mat-label>
    <textarea matInput formControlName="reason"></textarea>
  </mat-form-field>

  <!-- Submit -->
  <button
    mat-raised-button
    color="primary"
    type="submit"
    [disabled]="form.invalid">
    Submit Request
  </button>

</form>
