<div class="workflow-list-container">
 <button (click)="login()">Login</button>

  <div class="workflow-header">
    <h2>Workflow List</h2>

    <button mat-raised-button color="primary" (click)="createWorkflow()">
      <mat-icon>add</mat-icon>
      New Workflow
    </button>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2 workflow-table">


    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Workflow Name</th>
      <td mat-cell *matCellDef="let wf">
        {{ wf.name }}
      </td>
    </ng-container>


    <ng-container matColumnDef="lastModified">
      <th mat-header-cell *matHeaderCellDef>Last Modified</th>
      <td mat-cell *matCellDef="let wf">
        {{ wf.lastModified }}
      </td>
    </ng-container>

 
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let wf">
        <button mat-button color="primary" (click)="editWorkflow(wf)">
          Edit
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr 
      mat-row 
      *matRowDef="let row; columns: displayedColumns;"
      (click)="editWorkflow(row)">
    </tr>

  </table>

</div>
