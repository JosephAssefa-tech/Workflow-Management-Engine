<mat-card class="table-card">
  <mat-card-title>Running Workflows</mat-card-title>
<table mat-table [dataSource]="workflows" class="mat-elevation-z4 custom-table">

  <!-- Name Column -->
  <ng-container matColumnDef="workflowName">
    <th mat-header-cell *matHeaderCellDef> Workflow </th>
    <td mat-cell *matCellDef="let wf"> {{ wf.workflowName }} </td>
  </ng-container>

  <!-- Status Column -->
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef> Status </th>
    <td mat-cell *matCellDef="let wf">
      <span class="status" [ngClass]="wf.status">
        {{ wf.status }}
      </span>
    </td>
  </ng-container>

  <!-- Version Column -->
  <ng-container matColumnDef="version">
    <th mat-header-cell *matHeaderCellDef> Version </th>
    <td mat-cell *matCellDef="let wf"> v{{ wf.version }} </td>
  </ng-container>

  <!-- Created Column -->
  <ng-container matColumnDef="createdAt">
    <th mat-header-cell *matHeaderCellDef> Created </th>
    <td mat-cell *matCellDef="let wf">
      {{ wf.createdAt | date:'medium' }}
    </td>
  </ng-container>

  <!-- Last Executed Column -->
  <ng-container matColumnDef="lastExecutedAt">
    <th mat-header-cell *matHeaderCellDef> Last Run </th>
    <td mat-cell *matCellDef="let wf">
      {{ wf.lastExecutedAt | date:'medium' }}
    </td>
  </ng-container>

  <!-- Action Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let wf">
      <button mat-flat-button color="primary"
              (click)="startWorkflow(wf.definitionId)">
        Start
      </button>
    </td>
  </ng-container>

  <!-- Header & Rows -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
</mat-card>
